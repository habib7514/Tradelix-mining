
<section class="card">
  <h2>Buy Tradelix (TLX)</h2>

  <div class="label">Initial Sale Price</div>
  <div class="value gold">0.10 USDT</div>

  <div class="label">Minimum Purchase</div>
  <div class="value">5 USDT</div>

  <div class="label">Enter Purchase Amount (USDT)</div>
  <input
    type="number"
    id="purchaseAmount"
    min="5"
    step="0.01"
    placeholder="Enter amount (minimum 5 USDT)"
  >

  <button class="buy" id="buyButton">BUY TLX</button>

  <p class="info" id="purchaseInfo">
    You will receive 10 TLX for every 1 USDT.
  </p>

  <p class="info note">
    Purchases will be processed through the official Tradelix smart contract.
  </p>
</section>
