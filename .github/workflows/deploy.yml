name: Deploy Tradelix Mining to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Compile TLX Smart Contracts
        run: npx hardhat compile

      - name: Prepare BscScan Standard JSON
        run: |
          mkdir -p verification
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const dir = 'artifacts/build-info';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));

          function extract(source, output) {
            let found = null;

            for (const file of files) {
              const data = JSON.parse(
                fs.readFileSync(path.join(dir, file), 'utf8')
              );

              if (data.input?.sources?.[source]) {
                found = data.input;
                break;
              }
            }

            if (!found) {
              throw new Error(`${source} build info not found`);
            }

            fs.writeFileSync(output, JSON.stringify(found));
          }

          extract(
            'contracts/TradelixSale.sol',
            'verification/TradelixSale-standard-input.json'
          );

          extract(
            'contracts/TradelixToken.sol',
            'verification/TradelixToken-standard-input.json'
          );

          extract(
            'contracts/TradelixMining.sol',
            'verification/TradelixMining-standard-input.json'
          );
          NODE

      - name: Upload BscScan Sale Verification File
        uses: actions/upload-artifact@v4
        with:
          name: bscscan-tradelix-sale-standard-input
          path: verification/TradelixSale-standard-input.json
          retention-days: 7

      - name: Upload BscScan Token Verification File
        uses: actions/upload-artifact@v4
        with:
          name: bscscan-tradelix-token-standard-input
          path: verification/TradelixToken-standard-input.json
          retention-days: 7

      - name: Upload BscScan Mining Verification File
        uses: actions/upload-artifact@v4
        with:
          name: bscscan-tradelix-mining-standard-input
          path: verification/TradelixMining-standard-input.json
          retention-days: 7

      - name: Prepare Deployment Artifacts
        run: |
          mkdir -p public/contracts
          cp artifacts/contracts/TradelixMining.sol/TradelixMining.json public/contracts/
          cp artifacts/contracts/TradelixToken.sol/TradelixToken.json public/contracts/
          cp artifacts/contracts/TradelixSale.sol/TradelixSale.json public/contracts/

      - name: Run Smart Contract Tests
        run: npm test

      - name: Build Website
        run: npm run build -- --base=/Tradelix-mining/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4