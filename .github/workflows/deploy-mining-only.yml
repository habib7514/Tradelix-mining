
name: Deploy Tradelix Mining Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-mining:
    runs-on: ubuntu-latest
    environment: MAINNET-DEPLOY

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Compile contracts
        run: npx hardhat compile

      - name: Estimate deployment only
        run: node scripts/deploy-mining-only.cjs
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
