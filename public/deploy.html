
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradelix AI - Secure Deployment</title>
  <style>
    body {
      margin: 0;
      padding: 25px;
      background: #080d18;
      color: white;
      font-family: Arial, sans-serif;
    }
    .panel {
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      background: #111c2e;
      border: 1px solid #bd963c;
      border-radius: 15px;
    }
    h2 { color: #e4bd58; }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: #d4a83f;
      color: #08101d;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
    }
    #status {
      margin-top: 20px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>TRADELIX AI</h2>
    <h3>Secure Contract Deployment</h3>
    <p>Connect your TokenPocket wallet securely.</p>
    <button id="connect">CONNECT TOKENPOCKET</button>
    <div id="status">Wallet not connected.</div>
    <p style="color:#9aa8bd;font-size:13px">
      Connection test only. No transaction will be sent.
      Never enter your recovery phrase or private key.
    </p>
  </div>

  <script type="module">
    import { BrowserProvider } from
      "https://cdn.jsdelivr.net/npm/ethers@6.17.0/+esm";

    const treasury =
      "0x4E11E978119cAAB300b5439B909D06341C24a2A7";

    const status = document.getElementById("status");

    document.getElementById("connect").onclick = async () => {
      try {
        if (!window.ethereum) {
          throw new Error(
            "Wallet not detected. Open this page inside TokenPocket."
          );
        }

        status.textContent = "Connecting...";

        await window.ethereum.request({
          method: "eth_requestAccounts"
        });

        const provider = new BrowserProvider(window.ethereum);
        const signer = await provider.getSigner();
        const address = await signer.getAddress();
        const network = await provider.getNetwork();

        if (network.chainId !== 56n) {
          status.textContent =
            "Please switch TokenPocket to BNB Smart Chain Mainnet.";
          return;
        }

        if (address.toLowerCase() !== treasury.toLowerCase()) {
          status.textContent =
            "Connected, but this is not the approved Tradelix treasury wallet. No transaction was sent.";
          return;
        }

        status.textContent =
          "Wallet connected successfully.\n" +
          "Network: BNB Smart Chain Mainnet\n" +
          "Address: " + address +
          "\nNo transaction was sent.";

      } catch (error) {
        status.textContent = "Connection error: " + error.message;
      }
    };
  </script>
</body>
</html>
